# Netlify Configuration for Next.js

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

# DO NOT set publish for Next.js
# The Netlify Next plugin handles it automatically

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect API calls to your backend
[[redirects]]
  from = "/api/*"
  to = "https://burnout-backend-ke85.onrender.com/api/:splat"
  status = 200
  force = true
